# Construit l'application et la publie sur GitHub Pages (branche gh-pages)
# à chaque push. La clé anon Supabase est une clé publique côté client
# (présente dans tout build frontend) — elle n'est pas secrète.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ressort-application-40w7ex, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://wefapkdermwnspcuamkx.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlZmFwa2Rlcm13bnNwY3VhbWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NDMxMjUsImV4cCI6MjEwMDIxOTEyNX0.wEtnKU9a5-jhrqTnV6uiu-AJbmmd-wHeLCcGXsje8Xo
          VITE_BASE_PATH: /formation-atigroupe/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
