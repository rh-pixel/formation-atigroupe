# ============================================================
#  Configuration Netlify — Plateforme de formation ATIGROUPE
#  Ce fichier est lu automatiquement par Netlify au déploiement.
#  En général, vous n'avez PAS besoin de le modifier.
# ============================================================

[build]
  # Le site est 100 % statique : aucune compilation nécessaire.
  publish = "."

# Page d'erreur personnalisée si une adresse n'existe pas
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# En-têtes de sécurité appliqués à toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le catalogue ne doit jamais être mis en cache (mises à jour immédiates)
[[headers]]
  for = "/data/catalogue.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
