    border-radius:11px;font-family:inherit;color:var(--texte);outline:none}
  input.txt:focus{border-color:var(--bleu);background:#F5F9FD}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 28px}
  .chip{background:var(--clair);color:var(--bleu);font-weight:700;font-size:13px;
    padding:9px 16px;border-radius:999px}
  .btn{background:var(--bleu);color:#fff;border:none;font-size:16px;font-weight:700;
    padding:15px 30px;border-radius:11px;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{background:#0a3a6a;transform:translateY(-1px)}
  .btn:disabled{background:#B9C4CF;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--bleu);border:2px solid var(--bleu)}
  .btn.ghost:hover{background:var(--clair)}
  .btn.orange{background:var(--orange)}.btn.orange:hover{background:#d97e00}
  .btn.sm{font-size:14px;padding:11px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .prog{height:8px;background:var(--clair);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .prog>i{display:block;height:100%;background:var(--orange);width:0;transition:width .35s}
  .pinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--gris);
    font-weight:600;margin-bottom:8px}
  .who{font-size:13px;color:var(--gris);margin-bottom:22px}
  .who b{color:var(--bleu)}
  .qmod{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);
    font-weight:800;margin-bottom:8px}
  .qtext{font-size:22px;line-height:1.35;color:var(--bleu);font-weight:700;margin-bottom:24px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--blanc);border:2px solid #D8E0E8;color:var(--texte);
    padding:16px 18px;border-radius:12px;font-size:16px;cursor:pointer;
    margin-bottom:12px;transition:.13s;font-family:inherit}
  .opt:hover{border-color:var(--bleu);background:#F5F9FD}
  .opt .mark{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid #C2CCD6;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gris)}
  .opt.sel{border-color:var(--bleu);background:#EAF2FB}
  .opt.sel .mark{background:var(--bleu);border-color:var(--bleu);color:#fff}
  .score-wrap{text-align:center;padding:10px 0 4px}
  .rname{font-size:15px;color:var(--gris);margin-bottom:10px}
  .rname b{color:var(--bleu);font-size:18px}
  .ring{width:170px;height:170px;margin:4px auto 8px}
  .verdict{font-size:22px;font-weight:800;margin:6px 0 4px}
  .vsub{color:var(--gris);font-size:15px;margin-bottom:22px}
  .corr h2{font-size:17px;color:var(--bleu);margin:24px 0 14px;
    border-bottom:2px solid var(--clair);padding-bottom:8px}
  .item{border-radius:12px;padding:16px 18px;margin-bottom:12px;font-size:14.5px;line-height:1.55}
  .item.ok{background:var(--vert-bg)}.item.ko{background:var(--rouge-bg)}
  .item .iq{font-weight:700;color:var(--bleu);margin-bottom:8px}
  .item .il{margin:3px 0}
  .tag{font-weight:800;font-size:12px;padding:2px 9px;border-radius:6px;color:#fff}
  .tag.ok{background:var(--vert)}.tag.ko{background:var(--rouge)}
  .good{color:var(--vert);font-weight:700}.bad{color:var(--rouge);font-weight:700}
  .expl{color:var(--gris);font-style:italic;margin-top:6px}
  table.tb{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 18px}
  table.tb th{background:var(--bleu);color:#fff;text-align:left;padding:11px 12px;font-size:13px}
  table.tb td{padding:10px 12px;border-bottom:1px solid #E4EAF0}
  table.tb tr:nth-child(even) td{background:#F5F8FB}
  .kpi{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
  .kpi div{background:var(--clair);border-radius:12px;padding:14px 20px;flex:1;min-width:140px}
  .kpi b{display:block;font-size:26px;color:var(--bleu)}
  .kpi span{font-size:12px;color:var(--gris);font-weight:600}
  .note-box{background:#FFF6E6;border-left:4px solid var(--orange);padding:12px 16px;
    border-radius:8px;font-size:13px;color:#6a5526;margin:14px 0}
  .lnk{background:none;border:none;color:#9aa6b2;font-size:12px;cursor:pointer;
    text-decoration:underline;font-family:inherit}
  .foot{text-align:center;color:#9aa6b2;font-size:12px;margin-top:18px}
  @media print{body{background:#fff;padding:0}.card{box-shadow:none}
    .btn,.lnk,.note-box{display:none!important}}
  @media (max-width:560px){.pad{padding:26px 22px}h1{font-size:21px}.qtext{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="card"><div class="bandhead"></div><div class="pad" id="screen"></div></div>
  <div class="foot">ATIGROUPE&nbsp;&nbsp;•&nbsp;&nbsp;CNFPT Délégation Guyane&nbsp;&nbsp;•&nbsp;&nbsp;Découverte de l'ordinateur</div>
</div>
<script>
const QUESTIONS = [{"q": "Dans quel ordre un ordinateur traite-t-il l'information ?", "o": ["Sortie → Traitement → Entrée", "Entrée → Traitement → Sortie", "Traitement → Entrée → Sortie", "Entrée → Sortie → Traitement"], "c": 1, "f": "L'ordinateur reçoit (entrée), traite, puis restitue (sortie) l'information."}, {"q": "Lequel de ces éléments est du matériel (hardware) ?", "o": ["Microsoft Windows", "Le clavier", "Un courriel", "Le navigateur web"], "c": 1, "f": "Le matériel est ce que l'on peut toucher : clavier, écran, souris, unité centrale."}, {"q": "Quel composant est considéré comme le « cerveau » de l'ordinateur ?", "o": ["Le disque dur", "La mémoire vive", "Le processeur (CPU)", "La carte graphique"], "c": 2, "f": "Le processeur (CPU) exécute les calculs et les instructions."}, {"q": "À quoi sert la mémoire vive (RAM) ?", "o": ["Stocker les fichiers durablement", "Mémoire de travail temporaire", "Afficher l'image à l'écran", "Connecter à Internet"], "c": 1, "f": "La RAM est la mémoire de travail ; elle est vidée à l'extinction de l'ordinateur."}, {"q": "Le disque dur (ou SSD) sert à :", "o": ["Calculer", "Stocker durablement fichiers et logiciels", "Afficher l'écran", "Imprimer"], "c": 1, "f": "Le disque dur conserve les données même quand l'ordinateur est éteint."}, {"q": "Qu'est-ce qu'un système d'exploitation ?", "o": ["Un logiciel de bureautique", "Le logiciel maître qui pilote l'ordinateur", "Un site web", "Un type de clavier"], "c": 1, "f": "Le système d'exploitation (ex. Windows) pilote l'ordinateur et démarre à l'allumage."}, {"q": "Quel raccourci clavier permet d'enregistrer un document ?", "o": ["Ctrl + C", "Ctrl + S", "Ctrl + V", "Ctrl + Z"], "c": 1, "f": "Ctrl + S = enregistrer. À faire très régulièrement pour ne pas perdre son travail."}, {"q": "Que fait le raccourci Ctrl + Z ?", "o": ["Copier", "Coller", "Annuler la dernière action", "Tout sélectionner"], "c": 2, "f": "Ctrl + Z annule la dernière action effectuée."}, {"q": "Quelle action correspond au double-clic ?", "o": ["Sélectionner", "Ouvrir un dossier ou lancer un logiciel", "Ouvrir le menu contextuel", "Faire défiler la page"], "c": 1, "f": "Le double-clic ouvre un dossier ou lance un programme."}, {"q": "Comment éteindre correctement un ordinateur ?", "o": ["Débrancher la prise", "Maintenir le bouton enfoncé", "Menu Démarrer → Arrêter", "Fermer l'écran"], "c": 2, "f": "On éteint proprement via Démarrer → Marche/Arrêt → Arrêter, après avoir enregistré."}, {"q": "Le clic droit de la souris sert principalement à :", "o": ["Valider", "Ouvrir le menu contextuel", "Déplacer un fichier", "Zoomer"], "c": 1, "f": "Le clic droit ouvre le menu contextuel des actions disponibles."}];
const MOD_NUM = "Module 1";
const MOD_TITRE = "Découverte de l'ordinateur";
const TOTAL = QUESTIONS.length;
const STORE = "cnfpt_quiz_module_1_decouverte_ordinateur";
const CODE_FORMATEUR = "atigroupe";
let idx=0, answers=[], student="";
const scr=document.getElementById('screen');
const esc=s=>(""+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loadAll(){ try{return JSON.parse(localStorage.getItem(STORE)||"[]");}catch(e){return null;} }
function saveOne(rec){
  try{ const a=JSON.parse(localStorage.getItem(STORE)||"[]"); a.push(rec);
       localStorage.setItem(STORE,JSON.stringify(a)); return true; }
  catch(e){ return false; }
}

function renderHome(){
  scr.innerHTML=`
    <div class="brand">CNFPT Délégation Guyane — ATIGROUPE</div>
    <h1>Quiz — ${esc(MOD_NUM)} : ${esc(MOD_TITRE)}</h1>
    <p class="lead">Évaluation des acquis du module « ${esc(MOD_TITRE)} » —
      <b>${TOTAL} questions</b> à choix unique. Indiquez votre nom, puis répondez
      à chaque question. Votre note s'affichera à la fin.</p>
    <label class="fld" for="nm">Nom et prénom du stagiaire</label>
    <input class="txt" id="nm" placeholder="Ex. : Marie DUPONT" autocomplete="off"
      oninput="document.getElementById('go').disabled=!this.value.trim()"
      onkeydown="if(event.key==='Enter'&&this.value.trim())start()">
    <div class="meta">
      <span class="chip">${TOTAL} questions</span>
      <span class="chip">Correction automatique</span>
      <span class="chip">${esc(MOD_NUM)}</span>
    </div>
    <button class="btn" id="go" disabled onclick="start()">Commencer le quiz &#8594;</button>
    <div style="margin-top:26px">
      <button class="lnk" onclick="formateurLogin()">Espace formateur</button>
    </div>`;
}

function start(){
  const v=document.getElementById('nm').value.trim();
  if(!v) return;
  student=v; idx=0; answers=new Array(TOTAL).fill(null); renderQ();
}

function renderQ(){
  const q=QUESTIONS[idx], pct=Math.round(idx/TOTAL*100);
  const opts=q.o.map((o,i)=>`
    <button class="opt ${answers[idx]===i?'sel':''}" onclick="pick(${i})">
      <span class="mark">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>
    </button>`).join('');
  scr.innerHTML=`
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="pinfo"><span>Question ${idx+1} / ${TOTAL}</span><span>${pct}%</span></div>
    <div class="who">Stagiaire : <b>${esc(student)}</b> &nbsp;·&nbsp; ${esc(MOD_NUM)}</div>
    <div class="qmod">${esc(MOD_TITRE)}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${opts}
    <div class="row" style="margin-top:20px;justify-content:space-between">
      <button class="btn ghost" onclick="prev()" ${idx===0?'disabled':''}>&#8592; Pr&eacute;c&eacute;dent</button>
      <button class="btn orange" onclick="next()" ${answers[idx]===null?'disabled':''}>
        ${idx===TOTAL-1?'Terminer et voir ma note':'Suivant &#8594;'}</button>
    </div>`;
}
function pick(i){answers[idx]=i;renderQ();}
function prev(){if(idx>0){idx--;renderQ();}}
function next(){if(answers[idx]===null)return;
  if(idx<TOTAL-1){idx++;renderQ();}else finish();}

function finish(){
  let score=0; QUESTIONS.forEach((q,i)=>{if(answers[i]===q.c)score++;});
  const pct=Math.round(score/TOTAL*100);
  const now=new Date();
  const date=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR').slice(0,5);
  const rec={nom:student,module:MOD_NUM,modtitre:MOD_TITRE,score:score,
             total:TOTAL,pct:pct,date:date,reponses:answers.slice()};
  const saved=saveOne(rec);
  renderResult(rec, saved);
}

function renderResult(rec, saved){
  const nom=rec.nom, score=rec.score, pct=rec.pct;
  let v,vs,col;
  if(pct>=80){v="Excellent !";vs="Le module est bien ma&icirc;tris&eacute;.";col="#1B7A2F";}
  else if(pct>=60){v="Bien";vs="Bonne base, quelques points &agrave; revoir.";col="#0C447C";}
  else if(pct>=40){v="&Agrave; consolider";vs="Revoyez le module avant de continuer.";col="#F18F01";}
  else{v="&Agrave; revoir";vs="Une r&eacute;vision du module est recommand&eacute;e.";col="#B3261E";}
  const R=70,C=2*Math.PI*R,off=C*(1-score/TOTAL);
  const items=QUESTIONS.map((q,i)=>{
    const ok=answers[i]===q.c;
    const your=answers[i]==null?'<i>non r&eacute;pondu</i>':esc(q.o[answers[i]]);
    return `<div class="item ${ok?'ok':'ko'}">
      <div class="iq"><span class="tag ${ok?'ok':'ko'}">${ok?'JUSTE':'FAUX'}</span>
        &nbsp; ${i+1}. ${esc(q.q)}</div>
      <div class="il">R&eacute;ponse donn&eacute;e : <span class="${ok?'good':'bad'}">${your}</span></div>
      ${ok?'':`<div class="il">Bonne r&eacute;ponse : <span class="good">${esc(q.o[q.c])}</span></div>`}
      <div class="expl">${esc(q.f)}</div></div>`;
  }).join('');
  scr.innerHTML=`
    <div class="brand">R&eacute;sultat — ${esc(MOD_NUM)}</div>
    <div class="score-wrap">
      <div class="rname">Stagiaire : <b>${esc(nom)}</b> &nbsp;&middot;&nbsp; ${esc(rec.date)}</div>
      <svg class="ring" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="${R}" fill="none" stroke="#E6ECF1" stroke-width="14"/>
        <circle cx="85" cy="85" r="${R}" fill="none" stroke="${col}" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
          transform="rotate(-90 85 85)"/>
        <text x="85" y="80" text-anchor="middle" font-size="38" font-weight="800" fill="${col}">${score}</text>
        <text x="85" y="104" text-anchor="middle" font-size="14" fill="#6B7785">sur ${TOTAL}</text>
      </svg>
      <div class="verdict" style="color:${col}">${v} — ${pct}%</div>
      <div class="vsub">${vs}</div>
      <div class="row" style="justify-content:center">
        <button class="btn orange" onclick='dlFiche(${JSON.stringify(rec)})'>&#8595; T&eacute;l&eacute;charger ma fiche de r&eacute;sultats (CSV)</button>
      </div>
      <div class="note-box" style="background:#E8F0F8;border-left-color:#0C447C;color:#0C447C">
        <b>&#128206; &Eacute;tape importante :</b> cliquez sur « T&eacute;l&eacute;charger ma fiche »
        puis <b>remettez le fichier au formateur</b> (cl&eacute; USB, dossier partag&eacute;
        ou courriel). C'est ce fichier qui permet d'\u00e9tablir le bilan de la formation.
      </div>
      <div class="row" style="justify-content:center;margin-top:6px">
        <button class="btn sm" onclick="window.print()">Imprimer (archivage)</button>
        <button class="btn ghost sm" onclick="renderHome()">&#8635; Nouveau stagiaire</button>
      </div>
    </div>
    <div class="corr"><h2>Correction d&eacute;taill&eacute;e</h2>${items}</div>`;
  window.scrollTo(0,0);
}

function csvDL(filename, rows){
  const txt="\ufeff"+rows.map(r=>r.map(c=>'"'+(""+c).replace(/"/g,'""')+'"').join(';')).join("\r\n");
  const b=new Blob([txt],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function slug(s){
  return (""+s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function dlFiche(rec){
  const rows=[];
  // Bloc identité (lignes clé/valeur, faciles à filtrer dans Excel)
  rows.push(["Nom et prénom", rec.nom]);
  rows.push(["Module", rec.module + " — " + rec.modtitre]);
  rows.push(["Note", rec.score + " / " + rec.total]);
  rows.push(["Pourcentage", rec.pct + "%"]);
  rows.push(["Date", rec.date]);
  rows.push([]);
  // Tableau détaillé : une ligne par question
  rows.push(["Nom","Module","N°","Question","Réponse du stagiaire",
             "Bonne réponse","Résultat"]);
  QUESTIONS.forEach((q,i)=>{
    const a=rec.reponses[i];
    const donnee = (a==null) ? "(non répondu)" : q.o[a];
    const ok = (a===q.c) ? "JUSTE" : "FAUX";
    rows.push([rec.nom, rec.module, (i+1), q.q, donnee, q.o[q.c], ok]);
  });
  const fname = slug(rec.module) + "__" + slug(rec.nom) + ".csv";
  csvDL(fname, rows);
}

function formateurLogin(){
  const c=prompt("Espace formateur — code d'acc\u00e8s :");
  if(c===null) return;
  if(c.trim().toLowerCase()!==CODE_FORMATEUR){ alert("Code incorrect."); return; }
  renderDashboard();
}
function renderDashboard(){
  const all=loadAll();
  if(all===null){
    scr.innerHTML=`<div class="brand">Espace formateur</div>
      <h1>Tableau de bord — ${esc(MOD_NUM)}</h1>
      <div class="note-box">Le suivi fonctionne une fois ce fichier
        <b>enregistr&eacute; et ouvert depuis votre ordinateur</b> (double-clic).</div>
      <button class="btn ghost" onclick="renderHome()">&#8592; Retour</button>`;
    return;
  }
  let rows=`<tr><th>#</th><th>Nom et pr&eacute;nom</th><th>Note</th><th>%</th><th>Date</th></tr>`;
  all.forEach((r,i)=>{rows+=`<tr><td>${i+1}</td><td>${esc(r.nom)}</td>
    <td>${r.score} / ${r.total}</td><td>${r.pct}%</td><td>${esc(r.date)}</td></tr>`;});
  const n=all.length;
  const moy=n? (all.reduce((s,r)=>s+r.pct,0)/n) : 0;
  const reussite=n? Math.round(all.filter(r=>r.pct>=60).length/n*100) : 0;
  scr.innerHTML=`
    <div class="brand">Espace formateur — ${esc(MOD_NUM)}</div>
    <h1>Suivi des stagiaires</h1>
    <div class="kpi">
      <div><b>${n}</b><span>QUIZ COMPL&Eacute;T&Eacute;S</span></div>
      <div><b>${moy.toFixed(0)}%</b><span>MOYENNE</span></div>
      <div><b>${reussite}%</b><span>&#8805; 60% (R&Eacute;USSITE)</span></div>
    </div>
    ${n? `<table class="tb">${rows}</table>` : '<p class="lead">Aucun r&eacute;sultat enregistr&eacute;.</p>'}
    <div class="row">
      <button class="btn orange sm" onclick="exportAll()" ${n?'':'disabled'}>&#8595; Exporter (CSV)</button>
      <button class="btn ghost sm" onclick="renderDashboard()">&#8635; Actualiser</button>
      <button class="btn ghost sm" onclick="wipe()" ${n?'':'disabled'}>Effacer l'historique</button>
      <button class="btn ghost sm" onclick="renderHome()">&#8592; Retour</button>
    </div>
    <div class="note-box">L'historique est conserv&eacute; sur <b>ce poste et ce navigateur</b>.</div>`;
}
function exportAll(){
  const all=loadAll()||[];
  const rows=[["Nom et prénom","Module","Note","Sur","Pourcentage","Date",
               "N°","Question","Réponse du stagiaire","Bonne réponse","Résultat"]];
  all.forEach(r=>{
    if(r.reponses){
      QUESTIONS.forEach((q,i)=>{
        const a=r.reponses[i];
        const donnee=(a==null)?"(non répondu)":q.o[a];
        const ok=(a===q.c)?"JUSTE":"FAUX";
        rows.push([r.nom,r.module,r.score,r.total,r.pct+"%",r.date,
                   (i+1),q.q,donnee,q.o[q.c],ok]);
      });
    } else {
      rows.push([r.nom,r.module,r.score,r.total,r.pct+"%",r.date,"","","","",""]);
    }
  });
  csvDL("Resultats_"+slug(MOD_NUM)+"_detaille.csv",rows);
}
function wipe(){
  if(confirm("Effacer d\u00e9finitivement tous les r\u00e9sultats de ce module sur ce poste ?")){
    try{localStorage.removeItem(STORE);}catch(e){}
    renderDashboard();
  }
}

renderHome();
</script>
</body>
</html>
